name: Unity Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "release/*"
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.testMode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare package directory for GameCI package mode
        run: |
          mkdir -p ci/package
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.idea/' \
            --exclude 'ci/' \
            --exclude 'ValidationProject~/' \
            --exclude 'TestResults~/' \
            --exclude 'TempProject/' \
            --exclude 'artifacts/' \
            ./ ci/package/

      - name: Run Unity tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          packageMode: true
          projectPath: ci/package
          unityVersion: 6000.3.8f1
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: "${{ matrix.testMode }} Test Results"
          coverageOptions: ""
          artifactsPath: "artifacts-${{ matrix.testMode }}"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results-${{ matrix.testMode }}
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
